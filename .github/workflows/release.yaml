name: Release

# Builds the desktop (Windows / Linux / macOS) and mobile (Android / iOS) apps
# and attaches them to a GitHub Release. Build outputs are never committed to
# the repository — they are uploaded as release assets only.
#
# Trigger by pushing a version tag, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
# The workflow_dispatch trigger builds the apps without creating a release
# (useful for verifying the build).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Windows (x64) desktop build
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows zip
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "hamchannel-windows-x64.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: hamchannel-windows-x64.zip

  # ---------------------------------------------------------------------------
  # Linux (x64) desktop build
  # ---------------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          # GTK/Flutter desktop toolchain, ALSA headers for flutter_soloud, and
          # BlueZ + GLib headers for the native Bluetooth radio backend.
          sudo apt-get install -y \
            ninja-build libgtk-3-dev cmake clang pkg-config \
            libasound2-dev libbluetooth-dev libglib2.0-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package tar.gz
        run: |
          tar -czf "$GITHUB_WORKSPACE/hamchannel-linux-x64.tar.gz" \
            -C build/linux/x64/release/bundle .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: hamchannel-linux-x64.tar.gz

  # ---------------------------------------------------------------------------
  # macOS desktop build (unsigned)
  # ---------------------------------------------------------------------------
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS (unsigned)
        run: |
          # CI has no Developer ID / Mac Development certificate, so build
          # unsigned. Users may need to right-click > Open the first time.
          {
            echo 'CODE_SIGN_IDENTITY='
            echo 'CODE_SIGNING_REQUIRED=NO'
            echo 'CODE_SIGNING_ALLOWED=NO'
          } >> macos/Runner/Configs/Release.xcconfig
          flutter build macos --release

      - name: Create DMG
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -1)
          echo "Found app: $APP_PATH"
          STAGING_DIR="dmg_staging"
          mkdir -p "$STAGING_DIR"
          cp -R "$APP_PATH" "$STAGING_DIR/"
          ln -s /Applications "$STAGING_DIR/Applications"
          hdiutil create -volname "HamChannel" -srcfolder "$STAGING_DIR" \
            -ov -format UDZO -imagekey zlib-level=9 -o "hamchannel-macos.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: hamchannel-macos.dmg

  # ---------------------------------------------------------------------------
  # Android build (APK, debug-signed release)
  # ---------------------------------------------------------------------------
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk hamchannel-android.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: hamchannel-android.apk

  # ---------------------------------------------------------------------------
  # iOS build (unsigned .ipa — for sideloading only)
  # ---------------------------------------------------------------------------
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr hamchannel-ios.ipa Payload
          rm -rf Payload

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: hamchannel-ios.ipa

  # ---------------------------------------------------------------------------
  # Publish a GitHub Release with every build artifact (tag pushes only).
  # ---------------------------------------------------------------------------
  release:
    needs: [build-windows, build-linux, build-macos, build-android, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: HamChannel ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/windows-x64/hamchannel-windows-x64.zip
            artifacts/linux-x64/hamchannel-linux-x64.tar.gz
            artifacts/macos/hamchannel-macos.dmg
            artifacts/android/hamchannel-android.apk
            artifacts/ios/hamchannel-ios.ipa
