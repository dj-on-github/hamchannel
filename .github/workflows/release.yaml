name: Release

# Builds the desktop (Windows, Linux x64/arm64, macOS) and mobile (Android /
# iOS) apps and attaches the packaged binaries as assets on a GitHub Release.
# Nothing is committed back into the repository — the build outputs live only
# on the Release.
#
# Trigger by pushing a version tag, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
# Or run manually from the Actions tab (workflow_dispatch) with a version.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without leading v), e.g. 0.2.0'
        required: true

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Windows (x64) desktop build
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ github.event.inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows zip
        shell: pwsh
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          Compress-Archive -Path "$buildDir\*" -DestinationPath "hamchannel-windows-x64.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: hamchannel-windows-x64.zip

  # ---------------------------------------------------------------------------
  # Linux (x64 + arm64) desktop build
  # ---------------------------------------------------------------------------
  build-linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            deb_arch: amd64
            appimagetool_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
            appimagetool_arch: aarch64
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      # Flutter publishes prebuilt SDK archives for x64 only, so the marketplace
      # action works for x64 but fails on arm64. On arm64 we install from git,
      # whose bootstrap downloads the correct arm64 Dart SDK and engine.
      - name: Set up Flutter (x64)
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Flutter (arm64)
        if: matrix.arch == 'arm64'
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch stable "$HOME/flutter"
          git config --global --add safe.directory "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --version
          "$HOME/flutter/bin/flutter" precache --linux

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          # GTK/Flutter desktop toolchain, ALSA headers for flutter_soloud, and
          # BlueZ + GLib headers for the native Bluetooth radio backend.
          sudo apt-get install -y \
            ninja-build libgtk-3-dev liblzma-dev libstdc++-12-dev pkg-config cmake clang \
            libasound2-dev libbluetooth-dev libglib2.0-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package tar.gz
        run: |
          cd build/linux/${{ matrix.arch }}/release/bundle
          tar -czf "$GITHUB_WORKSPACE/hamchannel-linux-${{ matrix.arch }}.tar.gz" .

      - name: Package .deb
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG_DIR="hamchannel-deb"
          mkdir -p "$PKG_DIR/DEBIAN"
          mkdir -p "$PKG_DIR/usr/lib/hamchannel"
          mkdir -p "$PKG_DIR/usr/bin"
          mkdir -p "$PKG_DIR/usr/share/applications"
          mkdir -p "$PKG_DIR/usr/share/icons/hicolor/256x256/apps"

          cp -r build/linux/${{ matrix.arch }}/release/bundle/* "$PKG_DIR/usr/lib/hamchannel/"
          ln -sf /usr/lib/hamchannel/hamchannel "$PKG_DIR/usr/bin/hamchannel"

          cat > "$PKG_DIR/usr/share/applications/hamchannel.desktop" <<EOF
          [Desktop Entry]
          Name=HamChannel
          Comment=OFDM/LDPC soundcard data modem for VHF/UHF FM radios
          Exec=/usr/bin/hamchannel
          Icon=hamchannel
          Type=Application
          Categories=HamRadio;Network;
          Terminal=false
          EOF
          sed -i 's/^          //' "$PKG_DIR/usr/share/applications/hamchannel.desktop"

          cp macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png \
            "$PKG_DIR/usr/share/icons/hicolor/256x256/apps/hamchannel.png"

          cat > "$PKG_DIR/DEBIAN/control" <<EOF
          Package: hamchannel
          Version: ${VERSION}
          Section: hamradio
          Priority: optional
          Architecture: ${{ matrix.deb_arch }}
          Depends: libgtk-3-0, libasound2
          Recommends: pulseaudio-utils, bluez
          Maintainer: HamChannel <hamchannel@users.noreply.github.com>
          Description: HamChannel OFDM soundcard data modem
           An OFDM/LDPC soundcard data modem for VHF/UHF FM ham radios. Sends
           text messages and files between two stations over the audio path,
           with LDPC forward error correction and a reliable ARQ layer.
          EOF
          sed -i 's/^          //' "$PKG_DIR/DEBIAN/control"

          dpkg-deb --build "$PKG_DIR" "hamchannel-linux-${{ matrix.arch }}.deb"

      - name: Package AppImage
        run: |
          APPDIR="HamChannel.AppDir"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          cp -r build/linux/${{ matrix.arch }}/release/bundle/* "$APPDIR/usr/bin/"

          cat > "$APPDIR/hamchannel.desktop" <<EOF
          [Desktop Entry]
          Name=HamChannel
          Comment=OFDM/LDPC soundcard data modem for VHF/UHF FM radios
          Exec=hamchannel
          Icon=hamchannel
          Type=Application
          Categories=HamRadio;Network;
          Terminal=false
          EOF
          sed -i 's/^          //' "$APPDIR/hamchannel.desktop"
          cp "$APPDIR/hamchannel.desktop" "$APPDIR/usr/share/applications/hamchannel.desktop"

          cp macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png "$APPDIR/hamchannel.png"
          cp macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/hamchannel.png"

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/bin/lib:${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/hamchannel" "$@"
          EOF
          sed -i 's/^          //' "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.appimagetool_arch }}.AppImage" -O appimagetool
          chmod +x appimagetool
          ARCH=${{ matrix.appimagetool_arch }} ./appimagetool --no-appstream "$APPDIR" "hamchannel-linux-${{ matrix.arch }}.AppImage"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            hamchannel-linux-${{ matrix.arch }}.tar.gz
            hamchannel-linux-${{ matrix.arch }}.deb
            hamchannel-linux-${{ matrix.arch }}.AppImage

  # ---------------------------------------------------------------------------
  # macOS desktop build (unsigned)
  # ---------------------------------------------------------------------------
  build-macos:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS (unsigned)
        run: |
          # CI has no Developer ID / Mac Development certificate, so build
          # unsigned. Users may need to right-click > Open the first time.
          {
            echo 'CODE_SIGN_IDENTITY='
            echo 'CODE_SIGNING_REQUIRED=NO'
            echo 'CODE_SIGNING_ALLOWED=NO'
          } >> macos/Runner/Configs/Release.xcconfig
          flutter build macos --release

      - name: Create DMG
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -1)
          echo "Found app: $APP_PATH"
          STAGING_DIR="dmg_staging"
          mkdir -p "$STAGING_DIR"
          cp -R "$APP_PATH" "$STAGING_DIR/"
          ln -s /Applications "$STAGING_DIR/Applications"
          hdiutil create -volname "HamChannel" -srcfolder "$STAGING_DIR" \
            -ov -format UDZO -imagekey zlib-level=9 -o "hamchannel-macos.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: hamchannel-macos.dmg

  # ---------------------------------------------------------------------------
  # Android build (APK, debug-signed release)
  # ---------------------------------------------------------------------------
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk hamchannel-android.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: hamchannel-android.apk

  # ---------------------------------------------------------------------------
  # iOS build (unsigned .ipa — for sideloading only)
  # ---------------------------------------------------------------------------
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr hamchannel-ios.ipa Payload
          rm -rf Payload

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: hamchannel-ios.ipa

  # ---------------------------------------------------------------------------
  # Publish a GitHub Release with every build artifact.
  # ---------------------------------------------------------------------------
  release:
    needs: [build-windows, build-linux, build-macos, build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: HamChannel ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/windows-x64/hamchannel-windows-x64.zip
            artifacts/linux-x64/hamchannel-linux-x64.tar.gz
            artifacts/linux-x64/hamchannel-linux-x64.deb
            artifacts/linux-x64/hamchannel-linux-x64.AppImage
            artifacts/linux-arm64/hamchannel-linux-arm64.tar.gz
            artifacts/linux-arm64/hamchannel-linux-arm64.deb
            artifacts/linux-arm64/hamchannel-linux-arm64.AppImage
            artifacts/macos/hamchannel-macos.dmg
            artifacts/android/hamchannel-android.apk
            artifacts/ios/hamchannel-ios.ipa
